name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish/attach binaries to this release tag (e.g. v1.0.0). Leave empty to just build artifacts."
        required: false
        default: ""
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: GeneradorCodigoBarras-Windows
          - os: macos-latest
            artifact_name: GeneradorCodigoBarras-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --onefile
          --name "GeneradorCodigoBarras"
          --collect-all customtkinter
          --collect-all barcode
          --hidden-import "PIL._tkinter_finder"
          main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/GeneradorCodigoBarras.exe -DestinationPath GeneradorCodigoBarras-Windows.zip
        shell: pwsh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GeneradorCodigoBarras.app ../GeneradorCodigoBarras-macOS.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: GeneradorCodigoBarras-*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: GeneradorCodigoBarras-*.zip
